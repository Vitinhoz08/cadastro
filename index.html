<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Inteligente</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="card-cadastro">
    <h2>Criar Conta</h2>
   
    <form id="form-cadastro">
      <!-- Campo de E-mail (O Ajudante) -->
      <div class="grupo-campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
        <small class="mensagem-ajuda" id="ajuda-email"></small>
      </div>

      <!-- Campo de Senha (O Fiscal) -->
      <div class="grupo-campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>
       
        <!-- Requisitos da Senha -->
        <ul class="lista-requisitos">
          <li id="req-tamanho" class="invalido">Pelo menos 8 caracteres</li>
          <li id="req-maiuscula" class="invalido">Pelo menos uma letra maiúscula</li>
          <li id="req-numero" class="invalido">Pelo menos um número</li>
        </ul>
      </div>

      <button type="submit" id="btn-cadastrar">Cadastrar</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
